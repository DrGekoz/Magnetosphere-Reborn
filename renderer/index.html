<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; img-src 'self' data:; media-src 'self'">
<title>Magnetosphere Reborn</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #cfd8dc; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  /* top-right controls */
  #ui-root { position: fixed; top: 0; right: 0; z-index: 50; display: flex; gap: 8px; align-items: center; padding: 10px; pointer-events: none; }
  #ui-root > * { pointer-events: auto; }
  .ic { width: 20px; height: 20px; }
  #settings-btn, #quit-btn {
    background: rgba(10,14,20,0.55); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 8px; cursor: pointer; color: #9fb0c0;
    backdrop-filter: blur(6px); transition: all .15s;
  }
  #settings-btn:hover, #settings-btn.active { background: rgba(30,60,50,0.7); color: #8fffc0; border-color: rgba(80,255,170,0.4); }
  #quit-btn:hover { background: rgba(120,30,30,0.6); color: #ff8f8f; }
  #fps { font-family: Consolas, monospace; font-size: 11px; color: #8fffc0; background: rgba(10,14,20,0.5); padding: 4px 8px; border-radius: 8px; }

  /* panel */
  #panel {
    position: fixed; top: 0; right: 0; width: 380px; height: 100vh; z-index: 60;
    background: rgba(8,12,18,0.88); border-left: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(14px); display: flex; flex-direction: column;
    box-shadow: -20px 0 60px rgba(0,0,0,0.6); transform: translateX(0); transition: transform .25s ease;
  }
  #panel.hidden { transform: translateX(105%); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .panel-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; color: #dff5e8; }
  .panel-title .ic { width: 18px; height: 18px; color: #7dffb0; }
  .panel-close { cursor: pointer; color: #9fb0c0; padding: 6px; border-radius: 8px; }
  .panel-close:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .panel-scroll { flex: 1; overflow-y: auto; padding: 12px 14px 30px; }
  .panel-scroll::-webkit-scrollbar { width: 8px; }
  .panel-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

  .section { margin-bottom: 18px; }
  .sec-label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #6ee79a; margin-bottom: 8px; }
  .sec-label .ic { width: 14px; height: 14px; }

  .param { margin-bottom: 10px; }
  .param label { display: block; font-size: 12px; color: #a9b8c6; margin-bottom: 4px; }
  .slider-row { display: flex; align-items: center; gap: 8px; }
  .p-slider { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); outline: none; }
  .p-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #6ee79a; cursor: pointer; box-shadow: 0 0 8px rgba(110,231,154,0.5); }
  .p-val { font-family: Consolas, monospace; font-size: 11px; color: #7dffb0; width: 52px; text-align: right; }
  .p-toggle { width: 36px; height: 20px; -webkit-appearance: none; appearance: none; background: rgba(255,255,255,0.15); border-radius: 10px; position: relative; cursor: pointer; outline: none; transition: background .15s; }
  .p-toggle:checked { background: #2ea55f; }
  .p-toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
  .p-toggle:checked::after { left: 18px; }
  .p-drop {
    width: 100%; padding: 7px 10px; background: rgba(255,255,255,0.08); color: #dff5e8;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; font-size: 13px; cursor: pointer; outline: none;
  }
  .p-drop option { background: #0a0e14; }

  .theme-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  #theme-select { flex: 1; padding: 8px 10px; background: rgba(255,255,255,0.08); color: #dff5e8; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; font-size: 13px; cursor: pointer; outline: none; }
  #theme-select option { background: #0a0e14; }
  .icon-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 7px; cursor: pointer; color: #7dffb0; display: flex; align-items: center; }
  .icon-btn:hover { background: rgba(110,231,154,0.2); }
  .icon-btn.small { padding: 4px; }
  .icon-btn.small .ic { width: 14px; height: 14px; }
  .mini-btn { padding: 7px 12px; background: rgba(110,231,154,0.12); border: 1px solid rgba(110,231,154,0.35); border-radius: 8px; color: #8fffc0; font-size: 12px; cursor: pointer; }
  .mini-btn:hover { background: rgba(110,231,154,0.25); }

  .preset-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .preset-row { display: flex; align-items: center; gap: 4px; }
  .preset-name { padding: 4px 10px; font-size: 11px; }

  /* theme grid + categories + pager */
  .cat-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .cat-chip { padding: 4px 10px; font-size: 11px; border-radius: 12px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: #a9b8c6; cursor: pointer; }
  .cat-chip:hover { background: rgba(110,231,154,0.15); }
  .cat-chip.active { background: rgba(110,231,154,0.25); border-color: rgba(110,231,154,0.5); color: #8fffc0; }
  .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 8px; }
  .theme-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 6px; cursor: pointer; transition: all .15s; overflow: hidden; }
  .theme-card:hover { background: rgba(110,231,154,0.1); transform: translateY(-2px); }
  .theme-card.active { border-color: rgba(110,231,154,0.7); box-shadow: 0 0 10px rgba(110,231,154,0.25); }
  .theme-thumb { width: 100%; height: 56px; object-fit: cover; border-radius: 6px; background: #000; }
  .theme-name { font-size: 11px; font-weight: 600; color: #dff5e8; margin-top: 4px; }
  .theme-desc { font-size: 9px; color: #7d8b99; line-height: 1.3; }
  .pager-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 6px; }
  .pager-count { font-size: 11px; color: #7d8b99; }
  .mini-btn:disabled { opacity: 0.4; cursor: default; }

  /* about modal */
  .about-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: flex; align-items: center; justify-content: center; }
  .about-box { width: 420px; max-width: 90vw; max-height: 80vh; background: rgba(12,18,26,0.97); border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
  .about-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: 600; color: #dff5e8; }
  .about-close { cursor: pointer; color: #9fb0c0; display: flex; }
  .about-close:hover { color: #fff; }
  .about-body { padding: 16px; overflow-y: auto; max-height: 60vh; }
  .about-title { font-size: 17px; font-weight: 700; color: #8fffc0; margin-bottom: 4px; }
  .about-sub { font-size: 12px; color: #a9b8c6; line-height: 1.5; margin-bottom: 8px; }
  .about-built { font-size: 12px; color: #7dffb0; margin-bottom: 12px; }
  .about-credits { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .credit-item a { color: #6ee79a; font-size: 13px; text-decoration: none; }
  .credit-item a:hover { text-decoration: underline; }
  .credit-desc { font-size: 11px; color: #7d8b99; }
  .about-license { font-size: 10px; color: #6b7885; font-style: italic; }

  /* audioMotion overlay window */
  #audiomotion-window { position: fixed; z-index: 40; background: rgba(5,8,12,0.92); border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.7); display: flex; flex-direction: column; }
  .am-head { padding: 6px 10px; font-size: 11px; color: #7dffb0; background: rgba(255,255,255,0.05); cursor: move; user-select: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .am-canvas { flex: 1; width: 100%; display: block; }
  .am-grip { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; color: #7dffb0; font-size: 12px; display: flex; align-items: center; justify-content: center; user-select: none; }

  /* fullscreen hint */
  #fs-hint {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: rgba(8,12,18,0.7); border: 1px solid rgba(255,255,255,0.12);
    color: #8fffc0; font-size: 13px; font-family: "Segoe UI", system-ui, sans-serif;
    padding: 8px 18px; border-radius: 20px; letter-spacing: 0.4px;
    backdrop-filter: blur(6px); z-index: 80; pointer-events: none;
    transition: opacity 1.2s ease; opacity: 1;
  }
  #fs-hint.faded { opacity: 0; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script src="./umd.js"></script>
<script src="./vendor/three.js"></script>
<script src="./shaders.js"></script>

<script src="./presets.js"></script>
<script src="./templates.js"></script>
<script src="./scene.js"></script>
<script src="./audio.js"></script>

<!-- New post-processing & materials infrastructure (uses window.THREE) -->
<script src="./postprocessing-engine.js"></script>
<script src="./materials-library.js"></script>
<script src="./gltf-loader-engine.js"></script>
<script src="./webcam-hdri.js"></script>
<!-- Template engines -->
<script src="./milk.js"></script>
<script src="./vendor/butterchurn.js"></script>
<script src="./vendor/butterchurnPresetsMinimal.js"></script>
<script src="./vendor/butterchurnPresetsNonMinimal.js"></script>
<script src="./vendor/butterchurnPresetsExtra.js"></script>

<script src="./app.js"></script>
</body>
</html>

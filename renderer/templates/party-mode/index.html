<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>party-mode</title>
<link rel="stylesheet" href="./style.css">
<style>
  body { background: #000; overflow: hidden; }
  /* hide the original menu/chrome */
  #menu, .menu, #topbar, .about, #viz ~ * { display: none !important; }
</style>
</head>
<body>
<!-- required structure for party-mode main.js -->
<div id="audio_box"></div>
<div id="viz"></div>
<audio id="mp3_player" preload="auto"></audio>
<div id="slider"></div>
<div id="slider-volume"></div>
<!-- vendored locally for offline use (credit: preziotte/party-mode) -->
<script src="./d3.js"></script>
<script src="./d3.hexbin.v0.min.js"></script>
<script src="./jquery.js"></script>
<script src="./mousetrap.js"></script>
<script src="./main.js"></script>
<!-- bridge: receive audio levels from the host app -->
<script>
(function () {
  window.__HOST_AUDIO = {
    freqData: new Uint8Array(1024).fill(128),
    waveData: new Uint8Array(2048).fill(128),
    energy: 0, bass: 0, mid: 0, treble: 0, beat: 0,
  };
  window.addEventListener('message', (ev) => {
    const d = ev.data;
    if (!d || d.__mag !== 'mag-audio') return;
    if (d.fft && window.__HOST_AUDIO.freqData.length >= d.fft.length) {
      window.__HOST_AUDIO.freqData.set(d.fft);
    }
    if (d.wave && window.__HOST_AUDIO.waveData.length >= d.wave.length) {
      window.__HOST_AUDIO.waveData.set(d.wave);
    }
    window.__HOST_AUDIO.energy = d.energy || 0;
    window.__HOST_AUDIO.bass = d.bass || 0;
    window.__HOST_AUDIO.mid = d.mid || 0;
    window.__HOST_AUDIO.treble = d.treble || 0;
    window.__HOST_AUDIO.beat = d.beat || 0;
  });
  window.parent.postMessage({ __mag: 'mag-ready', id: 'party-mode' }, '*');
})();
</script>
<script>
  // boot party-mode with host audio instead of the file picker/mic
  // (runs synchronously before main.js's onload so a.init picks the mic path)
  // frameLooper references a global `audio` — provide a stub so it doesn't throw
  window.audio = document.getElementById('mp3_player') || { currentTime: 0, duration: 1, paused: true, play: function(){}, pause: function(){}, muted: false, volume: 1 };
  if (window.a) {
    window.a.loadSound = function () { window.a.microphone(); };
  }
  window.addEventListener('load', function () {
    try {
      if (window.a && window.a.init) window.a.init();
    } catch (e) { console.log('party-mode boot:', e.message); }
  });
</script>
</body>
</html>

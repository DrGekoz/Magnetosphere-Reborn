<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebGL Helpers — Three.js Examples</title>
<style>
*{margin:0;padding:0}body{background:#000;overflow:hidden;width:100vw;height:100vh}canvas{display:block;width:100%;height:100%;position:absolute;top:0;left:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// WebGL Helpers theme — inspired by mrdoob/three.js examples/webgl_helpers.html
// Pure WebGL point rendering of axes, grids, wireframe objects, particles
// AUDIO-REACTIVE: all parameters respond to system audio frequency data
(function(){
'use strict';
var gl=null,prog=null;
var canvas=document.getElementById('c');
if(!canvas)return;

try{gl=canvas.getContext('webgl2')||canvas.getContext('webgl')}catch(e){}
if(!gl){console.error('[helpers] no WebGL');return}

// ---- Vertex shader ----
var VS=[
'attribute vec3 aPos;',
'uniform mat4 uProj,uView;',
'uniform float uBeat,uTime;',
'varying float vPos;',
'void main(){',
'float s=1.+uBeat*0.5+sin(uTime)*0.05;',
'vec4 p=uProj*uView*vec4(aPos*s,1.);',
'gl_Position=p;',
'vPos=length(aPos)*0.05;',
'gl_PointSize=mix(1.,6.,clamp(vPos,0.,1.));',
'}'].join('\n');

// ---- Fragment shader ----
var FS=[
'precision mediump float;',
'uniform vec3 uColA,uColB,uBeatColor;',
'uniform float uBeat;',
'varying float vPos;',
'void main(){',
'vec3 col=mix(uColA,uColB,vPos);',
'col+=uBeatColor*uBeat*(1.-vPos)*0.3;',
'float d=length(gl_PointCoord-vec2(0.5))*2.;',
'gl_FragColor=vec4(col,(1.-smoothstep(0.6,1.,d))*0.9);',
'}'].join('\n');

function compileShader(s,t){
  var sh=gl.createShader(t);
  gl.shaderSource(sh,s);
  gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){
    console.error('[helpers] shader err:',gl.getShaderInfoLog(sh));
    return null;
  }
  return sh;
}

var vs=compileShader(VS,gl.VERTEX_SHADER);
var fs=compileShader(FS,gl.FRAGMENT_SHADER);
if(!vs||!fs)return;

prog=gl.createProgram();
gl.attachShader(prog,vs);
gl.attachShader(prog,fs);
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){
  console.error('[helpers] link:',gl.getProgramInfoLog(prog));
  return;
}

var uProj=gl.getUniformLocation(prog,'uProj');
var uView=gl.getUniformLocation(prog,'uView');
var uBeat=gl.getUniformLocation(prog,'uBeat');
var uTime=gl.getUniformLocation(prog,'uTime');
var uColA=gl.getUniformLocation(prog,'uColA');
var uColB=gl.getUniformLocation(prog,'uColB');
var uBeatColor=gl.getUniformLocation(prog,'uBeatColor');
var aPos=gl.getAttribLocation(prog,'aPos');

// Generate ALL scene geometry as points (axes + grids + boxes + particles)
var N=20000;
var pos=new Float32Array(N*3);
var i=0;

// --- X/Y/Z Axes ---
var axisLen=8;
for(var ax=0;ax<3&&i<N;ax++){
  for(var j=0;j<axisLen*2&&i<N;j++){
    var t=j/(axisLen*2-1);
    var p=-axisLen+t*axisLen*2;
    if(ax===0){pos[i*3]=p;pos[i*3+1]=0;pos[i*3+2]=0;}  // X
    else if(ax===1){pos[i*3]=0;pos[i*3+1]=p;pos[i*3+2]=0;}  // Y
    else{pos[i*3]=0;pos[i*3+1]=0;pos[i*3+2]=p;}  // Z
    i++;
  }
}

// --- Tick marks on each axis ---
for(var tk=0;tk<axisLen*2&&i<N;tk+=0.5){
  var off=0.3;
  // X-axis ticks (in YZ plane)
  if(i<N){pos[i*3]=-axisLen+tk;pos[i*3+1]=off;pos[i*3+2]=0;i++;}
  if(i<N){pos[i*3]=-axisLen+tk;pos[i*3+1]=-off;pos[i*3+2]=0;i++;}
  // Y-axis ticks (in XZ plane)
  if(i<N){pos[i*3]=off;pos[i*3+1]=-axisLen+tk;pos[i*3+2]=0;i++;}
  if(i<N){pos[i*3]=-off;pos[i*3+1]=-axisLen+tk;pos[i*3+2]=0;i++;}
  // Z-axis ticks (in XY plane)
  if(i<N){pos[i*3]=0;pos[i*3+1]=off;pos[i*3+2]=-axisLen+tk;i++;}
  if(i<N){pos[i*3]=0;pos[i*3+1]=-off;pos[i*3+2]=-axisLen+tk;i++;}
}

// --- Floor grid ---
var gridSize=12,gridDivs=12;
for(var gx=-gridSize/2;gx<=gridSize/2+0.5&&i<N;gx+=gridSize/gridDivs){
  if(i<N){pos[i*3]=gx;pos[i*3+1]=0;pos[i*3+2]=-gridSize/2;i++;}
  if(i<N){pos[i*3]=gx;pos[i*3+1]=0;pos[i*3+2]=gridSize/2;i++;}
}
for(var gz=-gridSize/2;gz<=gridSize/2+0.5&&i<N;gz+=gridSize/gridDivs){
  if(i<N){pos[i*3]=-gridSize/2;pos[i*3+1]=0;pos[i*3+2]=gz;i++;}
  if(i<N){pos[i*3]=gridSize/2;pos[i*3+1]=0;pos[i*3+2]=gz;i++;}
}

// --- Sample "helper objects" — wireframe cubes as point clouds ---
for(var box=0;box<3&&i<N;box++){
  var bx=(Math.random()-0.5)*8;
  var bz=(Math.random()-0.5)*8;
  var by=0.5+Math.random()*2;
  var sz=0.4+Math.random()*0.8;
  // Cube edges: 12 lines
  var vertices=[
    [bx-sz,by-sz,bz-sz],[bx+sz,by-sz,bz-sz],[bx+sz,by+sz,bz-sz],[bx-sz,by+sz,bz-sz],
    [bx-sz,by-sz,bz+sz],[bx+sz,by-sz,bz+sz],[bx+sz,by+sz,bz+sz],[bx-sz,by+sz,bz+sz]
  ];
  var edges=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  for(var e=0;e<edges.length&&i<N;e++){
    var v0=vertices[edges[e][0]],v1=vertices[edges[e][1]];
    var steps=20;
    for(var s=0;s<=steps&&i<N;s++){
      var st=s/steps;
      pos[i*3]=v0[0]+(v1[0]-v0[0])*st;
      pos[i*3+1]=v0[1]+(v1[1]-v0[1])*st;
      pos[i*3+2]=v0[2]+(v1[2]-v0[2])*st;
      i++;
    }
  }
}

// --- Decorative particle field (fills rest of space) ---
while(i<N){
  pos[i*3]=(Math.random()-0.5)*gridSize;
  pos[i*3+1]=Math.random()*6;
  pos[i*3+2]=(Math.random()-0.5)*gridSize;
  i++;
}

var buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,pos,gl.DYNAMIC_DRAW);

// Audio-reactive state
var hostAudio={energy:0,bass:0,mid:0,treble:0,freqData:null};
var timeVal=0,beatCount=0,lastBeatTime=0;
var beatPulse=0,camAngle=0;
var colA=[0.8,0.4,0.1],colB=[0.1,0.4,0.8],colBeat=[1,1,1];

// Resize
function resizeCanvas(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

// Matrix math
function mat4Perspective(fov,aspect,near,far){
  var f=1/Math.tan(fov/2),nf=1/(near-far);
  return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0]);
}
function mat4LookAt(eye,center,up){
  var zx=eye[0]-center[0],zy=eye[1]-center[1],zz=eye[2]-center[2];
  var len=1/Math.sqrt(zx*zx+zy*zy+zz*zz);
  var fz=[zx*len,zy*len,zz*len];
  var sx=up[1]*fz[2]-up[2]*fz[1],sy=up[2]*fz[0]-up[0]*fz[2],sz=up[0]*fz[1]-up[1]*fz[0];
  len=1/Math.sqrt(sx*sx+sy*sy+sz*sz);
  var fs=[sx*len,sy*len,sz*len];
  var ux=fz[1]*fs[2]-fz[2]*fs[1],uy=fz[2]*fs[0]-fz[0]*fs[2],uz=fz[0]*fs[1]-fz[1]*fs[0];
  return new Float32Array([fs[0],ux,fz[0],0,fs[1],uy,fz[1],0,fs[2],uz,fz[2],0,
    -(fs[0]*eye[0]+fs[1]*eye[1]+fs[2]*eye[2]),-(ux*eye[0]+uy*eye[1]+uz*eye[2]),-(fz[0]*eye[0]+fz[1]*eye[1]+fz[2]*eye[2]),1]);
}

// Listen for messages from parent app
window.addEventListener('message',function(ev){
  var d=ev.data;
  if(!d)return;
  if(d.__mag==='mag-audio'){
    if(d.freqData)hostAudio.freqData=d.freqData;
    hostAudio.energy=d.energy||0;hostAudio.bass=d.bass||0;
    hostAudio.mid=d.mid||0;hostAudio.treble=d.treble||0;
  }
  if(d.__mag==='mag-helpers-resize'&&d.w&&d.h){
    canvas.width=d.w;canvas.height=d.h;gl.viewport(0,0,d.w,d.h);
  }
});

gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);

// Main render loop
function loop(ts){
  requestAnimationFrame(loop);
  
  var lowEnergy=hostAudio.freqData?hostAudio.freqData[0]/255:0;
  timeVal+=(0.15+lowEnergy*0.3)*(1/60)*60;
  camAngle+=0.002*(1+lowEnergy*3);
  
  // Beat detection — audio reactive
  beatPulse*=0.93;
  if(hostAudio.energy>0.45&&performance.now()-lastBeatTime>300){
    lastBeatTime=performance.now();
    beatCount++;
    beatPulse=1;
    colA=[1,0.5+beatPulse*0.3,0.1];
    colB=[0.1,0.5+beatPulse*0.3,1];
  }
  
  // Slow color shift based on audio
  var hueShift=Math.sin(timeVal*0.05+lowEnergy*Math.PI)*0.5;
  colA=[0.6+hueShift*0.3,0.3-lowEnergy*0.1,0.2];
  colB=[0.2+lowEnergy*0.2,0.3,0.7+beatPulse*0.2];
  
  gl.useProgram(prog);
  gl.uniform1f(uTime,timeVal);
  gl.uniform1f(uBeat,beatPulse);
  gl.uniform3fv(uColA,colA);
  gl.uniform3fv(uColB,colB);
  gl.uniform3fv(uBeatColor,[1,1,1]);
  
  // Matrices — slow orbit camera
  var proj=mat4Perspective(Math.PI/4,canvas.width/canvas.height,0.1,100);
  gl.uniformMatrix4fv(uProj,false,proj);
  
  var cx=Math.sin(camAngle)*12;
  var cz=Math.cos(camAngle)*12;
  var view=mat4LookAt([cx,5,cz],[0,1,0],[0,1,0]);
  gl.uniformMatrix4fv(uView,false,view);
  
  // Bind & draw
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.POINTS,0,N);
}

loop(performance.now());

try{window.parent.postMessage({__mag:'mag-helpers-ready'},'*');}catch(e){}
})();
</script>
</body>
</html>
